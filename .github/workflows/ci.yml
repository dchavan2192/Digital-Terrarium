name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  demo-js:
    name: Demo presentation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-default-type=module --test web/demo/tests/*.test.mjs

  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Install libasound2-dev for macroquad's audio backend (quad_snd → alsa)
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo check --workspace
      - run: cargo clippy --workspace -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Install libasound2-dev for macroquad's audio backend (quad_snd → alsa)
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p sim-viewer --target wasm32-unknown-unknown --release --no-default-features
      - run: cargo build -p sim-wasm --target wasm32-unknown-unknown --release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # "Same seed = same run" must hold across platforms, not only on one machine.
      # Compare the complete simulation state of this x86-64 Linux build with the
      # WASM build at several ticks; any difference fails the job.
      - name: Native and WASM follow the same trajectory
        run: |
          cargo build -p sim-runner --release
          ./target/release/sim-runner fingerprint --seed 42 --ticks 0,1,100,2000 | grep '^tick=' > native.txt
          node web/demo/tests/conformance.mjs target/wasm32-unknown-unknown/release/sim_wasm.wasm configs/default.toml 42 0,1,100,2000 > wasm.txt
          cat native.txt
          diff native.txt wasm.txt
      # The same comparison with memory (recurrent connections) switched on, which
      # the default configuration leaves off.
      - name: Native and WASM follow the same trajectory with memory on
        run: |
          sed 's/^add_recurrent_probability = 0.0 /add_recurrent_probability = 0.3 /' configs/default.toml > memory-on.toml
          grep -q '^add_recurrent_probability = 0.3 ' memory-on.toml
          ./target/release/sim-runner fingerprint --config memory-on.toml --seed 42 --ticks 0,1,100,2000 | grep '^tick=' > native-memory.txt
          node web/demo/tests/conformance.mjs target/wasm32-unknown-unknown/release/sim_wasm.wasm memory-on.toml 42 0,1,100,2000 > wasm-memory.txt
          cat native-memory.txt
          diff native-memory.txt wasm-memory.txt

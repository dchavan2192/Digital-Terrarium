# Experiment D: Cooperation Phase Boundary
#
# HYPOTHESIS: Cooperation transitions from absent to universal at a sharp critical point
# in cost-benefit space — a phase transition analogous to Ising ferromagnetism.
# Hamilton's rule predicts cooperation when rB > C. Here B = share_amount ×
# transfer_efficiency (recipient benefit), C = share_amount (donor cost),
# r = kin_similarity (relatedness). Cooperation should vanish when transfer_efficiency
# falls below the critical value where rB ≈ C.
#
# BACKGROUND: The v2 "87% cooperation" finding was confounded by an energy-creation bug
# (transfer_efficiency was implicitly >1, violating conservation). With the corrected
# model (efficiency ≤ 1, enforced by Config::validate), Hamilton's rB > C is harder to
# satisfy. Finding the exact critical efficiency where cooperation collapses — and showing
# it matches the theoretical prediction — would be a rigorous, publishable ALife result.
# No other embodied ALife system has demonstrated a quantitative match to Hamilton's
# equation in evolved neural agents under strict energy conservation.
#
# SWEEP: sharing.transfer_efficiency in {0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0}
#   0.5  → donor pays 1.0, recipient gets 0.5; thermodynamically lossy sharing
#   0.9  → current default; kin selection should be active near this value
#   1.0  → energy-conserving (donor's loss = recipient's gain exactly)
#
# MEASUREMENT: cooperation_rate and kin_share_ratio at tick 500k.
# A sigmoidal transition in cooperation_rate vs transfer_efficiency would match
# thermodynamic phase transition theory. The inflection point = estimated critical η*.
#
# PREDICTION: If r̄ ≈ 0.3 (mean kin similarity) and share_amount = 5.0,
# Hamilton predicts cooperation when: transfer_efficiency > C/B = 1/r̄ ≈ 0.33.
# We expect cooperation to emerge around η* ≈ 0.5–0.7 and reach saturation at η = 0.9.
#
# Citation: Hamilton (1964) "The Genetical Evolution of Social Behaviour" J Theor Biol
# Citation: Trivers (1971) "The Evolution of Reciprocal Altruism" Q Rev Biol
# Citation: Nowak (2006) "Five Rules for the Evolution of Cooperation" Science
# Citation: Axelrod & Hamilton (1981) "The Evolution of Cooperation" Science
#
# Run: cargo run -p sim-runner --release -- sweep \
#       --config configs/experiments/cooperation_phase_boundary.toml \
#       --param sharing.transfer_efficiency \
#       --values 0.5,0.55,0.6,0.65,0.7,0.75,0.8,0.85,0.9,0.95,1.0 \
#       --seeds 10 --ticks 500000


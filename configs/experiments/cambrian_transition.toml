# Experiment E: Cambrian Transition — Neural Complexity Under Predation Pressure
#
# HYPOTHESIS: Enabling predation mid-simulation triggers a step-change increase in
# neural complexity (mean_connections, mean_hidden_nodes) in prey lineages, analogous
# to the Cambrian explosion where the emergence of predators drove rapid eye and
# sensory complexity evolution.
#
# DESIGN: Three arms, each 400k ticks, 10 seeds each = 30 runs:
#
#   Arm A (Cambrian): predation disabled (transfer_ratio=0.0, attack_cost=999) for
#     first 200k ticks, then enabled (ratio=0.75, cost=5.0) for final 200k ticks.
#     Implemented by running two sequential configs with checkpoint resume.
#     This arm uses combat.energy_transfer_ratio=0.0 as the sweep variable.
#
#   Arm B (Always-on predation): energy_transfer_ratio=0.75 throughout (positive control)
#
#   Arm C (No predation): energy_transfer_ratio=0.0 throughout (null baseline)
#
# SWEEP: This config sweeps energy_transfer_ratio in {0.0, 0.75} over 400k ticks.
# For the Cambrian arm (pre-switch + post-switch), run both phases separately:
#   Phase 1: 200k ticks, ratio=0.0, save checkpoint
#   Phase 2: 200k ticks, resume checkpoint with ratio=0.75
#
# MEASUREMENT: mean_connections, mean_hidden_nodes, mean_brain_entropy, mean_brain_activity
#   at ticks 50k, 100k, 150k, 200k (pre-switch) and 250k, 300k, 350k, 400k (post-switch).
#   The critical test: Does Arm A show higher mean_connections post-200k than Arm C?
#   And does the increase begin within 20k ticks of predation enabling?
#
# PREDICTION: Arms race dynamics (Dawkins & Krebs 1979) predict that prey evolve
# sensory/cognitive complexity in response to predator pressure. The "expensive tissue"
# hypothesis (Aiello & Wheeler 1995) predicts larger brains when survival advantage
# exceeds the metabolic cost. Expected effect: +10-25% mean_connections in Arm A
# post-switch relative to Arm C, with significant increase starting at tick 220k-240k.
#
# NOVELTY: No published ALife/NEAT system has demonstrated a Cambrian-style neural
# complexity transition driven by ecology. Polyworld (Yaeger) had predation but fixed
# topologies. Avida has no ecology. This would be a first.
#
# Citation: Aiello & Wheeler (1995) "The expensive-tissue hypothesis" Curr Anthropol
# Citation: Dawkins & Krebs (1979) "Arms races between and within species" Proc R Soc B
# Citation: Parker (1979) "Arms races in evolution" Phil Trans R Soc
# Citation: Laughlin et al. (1998) "The metabolic cost of neural information" Nature Neurosci
#
# Phase 1 run command (pre-Cambrian, 200k ticks):
#   cargo run -p sim-runner --release -- run \
#     --config configs/experiments/cambrian_transition.toml \
#     --set combat.energy_transfer_ratio=0.0 --set combat.attack_cost=999.0 \
#     --ticks 200000 --checkpoint-every 200000 --output output/cambrian_phase1
#
# Phase 2 run command (Cambrian explosion, resume + predation ON):
#   cargo run -p sim-runner --release -- run \
#     --resume output/cambrian_phase1/.../checkpoint.bin \
#     --set combat.energy_transfer_ratio=0.75 --set combat.attack_cost=5.0 \
#     --ticks 200000 --output output/cambrian_phase2
#
# Full sweep (always-on vs no-predation baseline, 400k ticks each):
#   cargo run -p sim-runner --release -- sweep \
#     --config configs/experiments/cambrian_transition.toml \
#     --param combat.energy_transfer_ratio \
#     --values 0.0,0.75 --seeds 10 --ticks 400000


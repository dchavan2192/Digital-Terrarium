# Experiment D — Diet Specialization and Niche Coexistence
#
# Science question: Does the MacArthur-Chesson competition kernel stabilize
# coexistence of algae and fruit specialists, and at what diet_slope does
# the generalist strategy go extinct?
#
# Tests the new diet_competition_sigma mechanism directly.
#
# Design (run as 2D sweep):
#   Axis 1: food.fruit.diet_slope = 0.5, 0.7, 1.0
#   Axis 2: density_pressure.diet_competition_sigma = 0.0, 0.2, 0.3, 0.5
#   Metric: variance of diet_preference at 300k ticks (high = specialization)
#   Also: species_count, mean_diet_preference distribution
#
# To run a 1D sweep over diet_slope:
#   cargo run -p sim-runner --release -- sweep \
#     --config configs/experiments/experiment_d_diet_coexistence.toml \
#     --param food.fruit.diet_slope \
#     --values 0.5,0.7,1.0 \
#     --seeds 5 --ticks 300000
#
# Null prediction (no competition kernel, sigma=0.0):
#   Diet variance should NOT increase — neutral drift only.
#
# Alternative (with competition kernel, sigma=0.3):
#   Frequency-dependent selection → bimodal diet distribution (two specialists).
#
# Citation: MacArthur (1972) "Geographical Ecology"
# Citation: Chesson (2000) "Mechanisms of Maintenance of Species Diversity"
# Citation: Roughgarden (1976) "Resource Partitioning Among Competing Species"
# Citation: Grant & Grant (2006) "Evolution of Character Displacement in Darwin's Finches"


# Experiment C — Neural Complexity Under Predation Arms Race
#
# Science question: Does predation pressure drive increases in neural complexity
# (mean connection count) relative to no-predation controls?
#
# Hypothesis: Predator-prey coevolution creates an evolutionary arms race
# where predators need better prey-detection brains and prey need better
# predator-evasion brains, increasing mean connections for BOTH strategies.
#
# Design (run as sweep over combat.energy_transfer_ratio):
#   - Low predation: energy_transfer_ratio = 0.3 (inefficient predation)
#   - Medium predation: energy_transfer_ratio = 0.75 (default)
#   - High predation: energy_transfer_ratio = 0.95 (nearly lossless transfer)
#   - Control: attack_cost = 999 (predation disabled)
#
# Measurement: mean_connections, species_count, mean_trophic_level at 500k ticks
# Track 10k-tick moving average to see trajectory.
#
# To run:
#   cargo run -p sim-runner --release -- sweep \
#     --config configs/experiments/experiment_c_neural_arms_race.toml \
#     --param combat.energy_transfer_ratio \
#     --values 0.3,0.5,0.75,0.95 \
#     --seeds 5 --ticks 500000
#
# Citation: Dawkins & Krebs (1979) "Arms Races Between and Within Species"
# Citation: Aiello & Wheeler (1995) "The expensive tissue hypothesis"
# Citation: Laughlin et al. (1998) "The metabolic cost of neural information"


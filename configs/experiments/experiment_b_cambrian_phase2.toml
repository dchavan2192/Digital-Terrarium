# Experiment B — Cambrian Transition: Phase 2
#
# Resume from Phase 1 checkpoint with:
#   - Food regrowth tripled (Cambrian oxygen/nutrient pulse)
#   - Predation unlocked (normal attack cost)
#   - Competition kernel enabled (niche coexistence)
#
# Run:
#   cargo run -p sim-runner --release -- single \
#     --config configs/experiments/experiment_b_cambrian_phase2.toml \
#     --checkpoint output/cambrian_phase1/checkpoint_200000.bin \
#     --ticks 300000
#
# Measurement: compare species_count, mean_connections, mean_trophic_level
# at ticks 200k vs 300k vs 400k vs 500k.

[world]
width = 1000.0
height = 1000.0
seed = 3000

[food]
cell_size = 10.0
max_per_cell = 1.0
regrowth_rate = 0.016          # 4x baseline — Cambrian resource pulse
energy_per_food = 15.0

[food.seasons]
amplitude = 0.4                # Stronger seasonality post-Cambrian
period = 10000.0

[food.droughts]
spawn_rate = 0.0003
duration = 3000
radius = 150.0
severity = 0.05
max_active = 4

[[food.biomes]]
x = 250.0
y = 250.0
radius = 200.0
regrowth_multiplier = 3.0

[[food.biomes]]
x = 750.0
y = 750.0
radius = 200.0
regrowth_multiplier = 3.0

[[food.biomes]]
x = 500.0
y = 500.0
radius = 150.0
regrowth_multiplier = 2.0

[[food.biomes]]
x = 750.0
y = 250.0
radius = 180.0
regrowth_multiplier = 0.3

[food.fruit]
enabled = true
energy_per_fruit = 20.0
biome_rate_multiplier = 2.0
diet_slope = 0.7

[creature]
initial_count = 300
hard_cap = 3000               # Relaxed cap with expanded resources
body_radius = 3.0
max_speed = 2.0
max_turn = 0.2
max_age = 2000
feeding_speed_factor = 0.5

[creature.vision]
ray_count = 5
fov = 2.094
range = 60.0

[energy]
starting = 60.0
maximum = 200.0
base_metabolism = 0.3
movement_cost = 0.15
brain_cost = 0.001
connection_cost = 0.001
activity_weight_cost = 0.0005

[reproduction]
threshold = 60.0
parent_cost = 30.0
child_energy = 30.0
sexual = true
mate_range = 15.0
crossover_rate = 0.7
fitness_bias = true
mate_cost = 30.0
mate_energy_fraction = 0.5

[combat]
attack_range = 8.0
attack_cost = 5.0              # CAMBRIAN: predation enabled
idle_attack_cost = 0.0
attack_damage = 20.0
energy_transfer_ratio = 0.75

[sharing]
share_range = 10.0
share_amount = 5.0
transfer_efficiency = 0.9

[aging]
extrinsic_mortality = 0.0001
initial_senescence = 0.00001
aging_rate = 0.002

[mutation]
weight_probability = 0.1
weight_step = 0.2
add_connection_probability = 0.02
add_node_probability = 0.01
toggle_probability = 0.01
prune_probability = 0.02
add_recurrent_probability = 0.0
trait_probability = 0.05
diet_mutation_step = 0.1

[density_pressure]

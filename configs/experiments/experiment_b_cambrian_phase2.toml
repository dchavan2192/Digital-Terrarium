diet_competition_sigma = 0.3

[speciation]
dynamic = true
fixed_threshold = 0.5
sample_size = 50
factor = 0.75
min_threshold = 0.1
max_threshold = 2.0

[brain]
inputs = 20
hidden = 8
outputs = 7

[temperature]
enabled = true
cost_factor = 0.5

[pheromones]
enabled = true
deposit_rate = 0.1
decay_rate = 0.995
max_level = 10.0

[daynight]
enabled = true
period = 40.0

[elevation]

# Terrarium — Demo Configuration
# Balanced for an engaging live demo: visible scarcity, active cooperation,
# but populations survive and evolve visibly. Not too easy, not extinction-level.

[world]
width = 1000.0
height = 1000.0
seed = 42

[food]
cell_size = 10.0
max_per_cell = 1.0
regrowth_rate = 0.002           # Moderate — visible depletion near clusters
energy_per_food = 12.0          # Decent payoff per bite

[food.seasons]
amplitude = 0.3                 # Mild seasons
period = 8000.0

[food.droughts]
spawn_rate = 0.0003             # Occasional droughts — not constant
duration = 2500
radius = 150.0
severity = 0.05                 # 5% regrowth, not 2%
max_active = 2                  # At most 2 simultaneous

[[food.biomes]]
x = 250.0
y = 250.0
radius = 200.0
regrowth_multiplier = 3.0       # Lush oases — visible green zones

[[food.biomes]]
x = 750.0
y = 750.0
radius = 200.0
regrowth_multiplier = 3.0

[[food.biomes]]
x = 500.0
y = 500.0
radius = 150.0
regrowth_multiplier = 2.0

[[food.biomes]]
x = 750.0
y = 250.0
radius = 180.0
regrowth_multiplier = 0.3       # Barren zone

[creature]
initial_count = 300
hard_cap = 800                  # Room to grow but not overwhelming
body_radius = 3.0
max_speed = 2.0
max_turn = 0.2
max_age = 2500

[creature.vision]
ray_count = 5
fov = 2.094
range = 60.0

[energy]
starting = 60.0
maximum = 200.0
base_metabolism = 0.4           # Noticeable burn but not brutal
movement_cost = 0.1
brain_cost = 0.001
connection_cost = 0.001         # Per-synapse cost — Attwell & Laughlin (2001)

[reproduction]
threshold = 65.0
parent_cost = 30.0
child_energy = 30.0

[combat]
attack_range = 8.0
attack_cost = 4.0
attack_damage = 22.0
energy_transfer_ratio = 0.75

[sharing]
share_range = 10.0
share_amount = 5.0
benefit_multiplier = 1.5

[aging]
extrinsic_mortality = 0.0001
initial_senescence = 0.00002
aging_rate = 0.002

[mutation]
weight_probability = 0.12
weight_step = 0.25

[density_pressure]
cost_per_neighbor = 0.02

[speciation]
dynamic = true
fixed_threshold = 0.5
sample_size = 50
factor = 0.75
min_threshold = 0.1
max_threshold = 2.0

[brain]
inputs = 15
hidden = 8
outputs = 6

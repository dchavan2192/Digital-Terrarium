# Terrarium — Default Configuration
# Every tunable number lives here. No magic constants in the code.
# Copy this file and change one section at a time for experiments.

[world]
width = 1000.0          # World width in units
height = 1000.0         # World height in units
seed = 42               # RNG seed — same seed, same run

[food]
cell_size = 10.0        # Grid cell size in world units (world/cell_size = grid dims)
max_per_cell = 1.0      # Maximum food a single cell can hold
regrowth_rate = 0.0005  # Food regrown per cell per tick (cut from 0.0015 — real scarcity)
energy_per_food = 15.0  # Energy gained per 1.0 unit of food consumed (halved from 30 to make predation viable)

# Spatial resource gradients — ecological niches that drive adaptive radiation.
# Each biome is a circular zone with a regrowth multiplier (smooth falloff from center).
# Citation: Schluter (2000) "The Ecology of Adaptive Radiation"
# Citation: Rosenzweig (1995) "Species Diversity in Space and Time"
# Seasonal (cyclical) food variation — regrowth oscillates sinusoidally over time.
# Multiplier = 1.0 + amplitude * sin(2π * tick / period)
# Creates boom-bust resource cycles that select for energy-buffering strategies.
# Citation: Botkin (1990) "Forest Dynamics: An Ecological Model"
[food.seasons]
amplitude = 0.3         # Regrowth swings 70%-130% of base (0 = no seasons)
period = 10000.0        # One full cycle every 10k ticks

# Stochastic localized droughts — temporary food-killing zones.
# Forces migration, predation, and cooperation by creating scarcity pockets.
# Citation: Holling (1973) "Resilience and Stability of Ecological Systems"
# Citation: Connell (1978) intermediate disturbance hypothesis
[food.droughts]
spawn_rate = 0.0002     # ~one new drought every 5000 ticks
duration = 3000         # Each drought lasts 3000 ticks
radius = 150.0          # Affected area radius in world units
severity = 0.05         # Regrowth drops to 5% inside drought zone
max_active = 3          # At most 3 simultaneous droughts

[[food.biomes]]
x = 250.0               # Lush oasis — northwest quadrant
y = 250.0
radius = 200.0
regrowth_multiplier = 3.0

[[food.biomes]]
x = 750.0               # Lush oasis — southeast quadrant
y = 750.0
radius = 200.0
regrowth_multiplier = 3.0

[[food.biomes]]
x = 500.0               # Moderate zone — center
y = 500.0
radius = 150.0
regrowth_multiplier = 2.0

[[food.biomes]]
x = 750.0               # Barren zone — northeast
y = 250.0
radius = 180.0
regrowth_multiplier = 0.3

[creature]
initial_count = 300     # Creatures spawned at tick 0
hard_cap = 500          # Maximum living creatures (cut from 1500 — forces competition)
body_radius = 3.0       # Collision/eating radius in world units
max_speed = 2.0         # Maximum movement speed (units/tick)
max_turn = 0.2          # Maximum turn rate (radians/tick)
max_age = 2000          # Death by old age (lowered from 3000 for faster evolutionary turnover)

[creature.vision]
ray_count = 5           # Number of vision rays cast
fov = 2.094             # Field of view in radians (~120 degrees)
range = 60.0            # How far each ray sees (world units)

[energy]
starting = 60.0         # Energy a new creature begins with (tick 0 spawns)
maximum = 200.0         # Energy cap — eating beyond this is wasted
base_metabolism = 0.6   # Flat energy cost per tick (raised from 0.2 to create real scarcity)
movement_cost = 0.15    # Multiplied by speed^2 per tick (raised from 0.08)
brain_cost = 0.002      # Cost per neuron per tick — the key intelligence tax

[reproduction]
threshold = 60.0        # Minimum energy to reproduce
parent_cost = 30.0      # Energy deducted from the parent
child_energy = 30.0     # Energy the offspring starts with

[combat]
# Predator-prey dynamics: Lotka-Volterra (1925/1926), Yaeger Polyworld (1994)
attack_range = 8.0            # Must be close to attack (roughly 2x body_radius)
attack_cost = 5.0             # Energy spent per attack attempt (discourages spam)
attack_damage = 20.0          # Base damage per successful hit
energy_transfer_ratio = 0.75  # Attacker absorbs 75% of damage as energy (raised from 0.5 to make predation viable)

[sharing]
# Energy sharing: Hamilton (1964) kin selection, Trivers (1971) reciprocal altruism
share_range = 10.0            # Must be close to share (slightly > attack_range)
share_amount = 5.0            # Energy the donor pays per share action
benefit_multiplier = 1.5      # Recipient gets share_amount * 1.5 (Hamilton: B > C enables rB > C)

[aging]
# Gompertz-Makeham mortality: h(age) = λ + α·exp(β·age)
# Citation: Gompertz (1825), Williams (1957), Kirkwood (1977)
extrinsic_mortality = 0.0001  # λ — age-independent death rate (accidents/background hazard)
initial_senescence = 0.00001  # α — baseline senescence at birth (tiny, grows with age)
aging_rate = 0.002            # β — default aging rate (evolvable via genome)

[mutation]
weight_probability = 0.1  # Chance each weight mutates during reproduction
weight_step = 0.2         # Max magnitude of a weight mutation (uniform ±step)

[density_pressure]
# Population density pressure: crowding increases metabolism.
# Each nearby creature (within vision range) adds this much to per-tick metabolic cost.
# Models negative density dependence / interference competition.
# Citation: Allee (1931) "Animal Aggregations: A Study in General Sociology"
cost_per_neighbor = 0.01

[speciation]
# Dynamic speciation threshold: compute from population genome variance
# instead of using a fixed value. Adapts species count to actual diversity.
# Citation: Stanley & Miikkulainen (2002) "Evolving Neural Networks through Augmenting Topologies"
dynamic = true                # true = compute from variance, false = use fixed_threshold
fixed_threshold = 0.5         # Fallback when dynamic=false (NEAT compatibility distance)
sample_size = 50              # Organisms sampled for mean pairwise distance (O(n²) among sample)
factor = 0.75                 # threshold = factor × mean_distance
min_threshold = 0.1           # Floor: prevents over-splitting
max_threshold = 2.0           # Ceiling: prevents one giant species

[brain]
inputs = 18             # Sensors: 5 rays×2 + energy + heading + signal + body_size + kin_similarity + temp + pheromone + light
hidden = 8              # Default hidden layer neurons (evolvable per-organism, range 4-32)
outputs = 6             # turn, speed, eat, attack, signal, share

# North-south temperature gradient — cold at y=0 (north), warm at y=world_height (south).
# Each creature has an evolvable preferred_temp gene [0,1]. Metabolism penalty scales with
# mismatch: temp_cost = base_metabolism * cost_factor * |local_temp - preferred_temp|
# This drives Bergmann's rule (1847): larger body mass in cold climates for heat retention,
# and allopatric speciation across the thermal gradient.
# Citation: Bergmann (1847) "Über die Verhältnisse der Wärmeökonomie der Thiere zu ihrer Größe"
# Citation: Allen (1877) "The influence of Physical Conditions in the Genesis of Species"
# Fruit food type — grows only inside biome zones at 2x the biome rate.
# Algae (the existing food) grows everywhere at the base regrowth rate.
# Creatures have an evolvable diet_preference gene [0,1]: 0=algae specialist,
# 1=fruit specialist. Generalists (0.5) get ~65% digestion efficiency from either.
# This drives adaptive radiation: populations diverge along the diet axis,
# reducing interspecific competition (character displacement).
# Citation: Grant & Grant (2006) "Evolution of Character Displacement in Darwin's Finches"
# Citation: Schluter (2000) "The Ecology of Adaptive Radiation"
[food.fruit]
enabled = true
energy_per_fruit = 20.0        # Energy per unit fruit (before diet efficiency)
biome_rate_multiplier = 2.0    # Fruit regrowth = biome_rate × 2.0 (rich but limited)

[temperature]
enabled = true
cost_factor = 0.5       # Up to 50% extra metabolism at max mismatch (mismatch=1.0)

# Per-cell pheromone layer enabling stigmergic (indirect) communication.
# Each creature deposits pheromone at its current cell each tick.
# Pheromone decays multiplicatively, creating concentration gradients.
# Brains attending to local pheromone can evolve trail-following, territory
# marking, migration coordination, and predator-avoidance.
# Self-organization: positive feedback loop when creatures follow
# high-pheromone paths, reinforcing those paths — the Deneubourg mechanism.
# Citation: Wilson (1975) "Sociobiology: The New Synthesis"
# Citation: Deneubourg et al. (1990) J. Insect Behavior 3(2):159-168
[pheromones]
enabled = true
deposit_rate = 0.1      # Pheromone added per creature per tick at its cell
decay_rate = 0.99       # Multiplicative decay per tick (~100-tick half-life)
max_level = 10.0        # Cell cap; prevents unbounded accumulation

# Day/night cycle — sinusoidal light modulates effective vision range.
# Light level = (1 + sin(2π * tick / period)) / 2, oscillating [0, 1].
# During night (light < 0.5), vision range is halved.
# Drives temporal niche partitioning: diurnal vs nocturnal strategies.
# Pheromone trails become more valuable at night when vision fails.
# Brain input (light level, input 18) wired in FOURTH step.
# Citation: Kronfeld-Schor & Dayan (2003) Annual Review of Ecology 34:153-181
[daynight]
enabled = true
period = 1000.0         # Ticks per full cycle (day + night = 1000 ticks)

# Elevation map — multi-octave sine height field (no external crates).
# h(x,y) = Σ_k (1/2^k) * sin(2^k*fx*x + φ) * sin(2^k*fy*y + φ)
# Movement penalty: speed *= 1/(1 + slope_factor * |Δheight|)
# Creates ridges, valleys and island-like patches that fragment populations
# and drive allopatric speciation through isolation by distance.
# Citation: MacArthur & Wilson (1967) "The Theory of Island Biogeography"
# Citation: Wright (1943) "Isolation by Distance" Genetics 28(2):114-138
[elevation]
enabled = true
slope_factor = 5.0      # At Δh=0.2 (steep), speed halves
octaves = 4             # Number of sine octaves (detail level)
seed = 7777             # Height map seed — independent of main sim seed

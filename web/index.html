<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrarium — Evolutionary Simulation</title>
    <meta name="description" content="Watch creatures with evolvable neural-net brains live, compete, cooperate, and evolve in a sealed 2D world.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }

        /* Loading screen */
        #loading {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #0a0a0f; color: #c0c0c0;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            z-index: 100;
            transition: opacity 0.6s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading h1 {
            font-size: 2.5rem; color: #4ade80;
            margin-bottom: 0.5rem; font-weight: 300;
            letter-spacing: 0.15em;
        }
        #loading p { font-size: 0.9rem; color: #666; margin-bottom: 2rem; }
        #progress-bar {
            width: 300px; height: 4px;
            background: #1a1a2e; border-radius: 2px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #4ade80, #22d3ee);
            border-radius: 2px;
            transition: width 0.3s;
        }
        #status { font-size: 0.75rem; color: #555; margin-top: 0.75rem; }
        #controls {
            font-size: 0.7rem; color: #444; margin-top: 2rem;
            text-align: center; line-height: 1.8;
        }
        #controls kbd {
            background: #1a1a2e; padding: 2px 6px;
            border-radius: 3px; border: 1px solid #333;
            color: #888;
        }

        /* Canvas — macroquad manages it */
        canvas { display: block; outline: none; }
    </style>
</head>
<body>
    <div id="loading">
        <h1>TERRARIUM</h1>
        <p>Evolutionary simulation with neural-net brains</p>
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <div id="status">Initializing...</div>
        <div id="controls">
            <kbd>Space</kbd> pause &nbsp;
            <kbd>Scroll</kbd> zoom &nbsp;
            <kbd>Click</kbd> inspect creature
        </div>
    </div>

    <!-- macroquad's miniquad JS runtime -->
    <script src="mq_js_bundle.js"></script>
    <script>
        var progress = document.getElementById("progress-fill");
        var status = document.getElementById("status");
        var loading = document.getElementById("loading");

        // Hide loading screen after a few frames of rendering
        var _mqFrameCount = 0;
        var _origRAF = window.requestAnimationFrame;
        window.requestAnimationFrame = function(cb) {
            return _origRAF(function(ts) {
                _mqFrameCount++;
                if (_mqFrameCount === 5) {
                    loading.classList.add("hidden");
                }
                cb(ts);
            });
        };

        progress.style.width = "30%";
        status.textContent = "Loading WASM module...";

        load("sim-viewer.wasm");

        async function load(wasmPath) {
            progress.style.width = "50%";
            status.textContent = "Fetching " + wasmPath + "...";

            const resp = await fetch(wasmPath);
            const bytes = await resp.arrayBuffer();

            progress.style.width = "80%";
            status.textContent = "Compiling & starting...";

            // miniquad's wasm_exports.wasm_module is set by mq_js_bundle.js
            // We use the standard miniquad load pattern
            const importObject = register_plugins({
                env: {}
            });

            const { instance } = await WebAssembly.instantiate(bytes, importObject);
            wasm_exports(instance.exports);

            progress.style.width = "100%";
            status.textContent = "Running!";

            init();
        }
    </script>
</body>
</html>

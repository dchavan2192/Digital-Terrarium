<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrarium — Evolutionary Simulation</title>
    <meta name="description" content="Watch creatures with evolvable neural-net brains live, compete, cooperate, and evolve in a sealed 2D world.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }

        #loading {
            position: fixed; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #0a0a0f; color: #c0c0c0;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            z-index: 100;
            transition: opacity 0.6s;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading h1 {
            font-size: 2.5rem; color: #4ade80;
            margin-bottom: 0.5rem; font-weight: 300;
            letter-spacing: 0.15em;
        }
        #loading p { font-size: 0.9rem; color: #666; margin-bottom: 2rem; }
        #controls {
            font-size: 0.7rem; color: #444; margin-top: 2rem;
            text-align: center; line-height: 1.8;
        }
        #controls kbd {
            background: #1a1a2e; padding: 2px 6px;
            border-radius: 3px; border: 1px solid #333;
            color: #888;
        }

        canvas { display: block; outline: none; }
    </style>
</head>
<body>
    <div id="loading">
        <h1>TERRARIUM</h1>
        <p>Evolutionary simulation with neural-net brains</p>
        <p style="color:#555">Loading WASM module...</p>
        <div id="controls">
            <kbd>Space</kbd> pause &nbsp;
            <kbd>Scroll</kbd> zoom &nbsp;
            <kbd>Click</kbd> inspect creature
        </div>
    </div>

    <!-- macroquad/miniquad requires this canvas element -->
    <canvas id="glcanvas" tabindex="1"></canvas>

    <script src="mq_js_bundle.js"></script>
    <script>
        // Hide loading screen once miniquad starts rendering
        var _mqFrames = 0;
        var _origRAF = window.requestAnimationFrame;
        window.requestAnimationFrame = function(cb) {
            return _origRAF(function(ts) {
                _mqFrames++;
                if (_mqFrames === 3) {
                    document.getElementById("loading").classList.add("hidden");
                }
                cb(ts);
            });
        };

        // Standard macroquad/miniquad WASM load — mq_js_bundle.js provides load()
        load("sim-viewer.wasm");
    </script>
</body>
</html>

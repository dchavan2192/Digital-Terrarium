# Terrarium — Browser Demo OVERLAY
#
# This is NOT a full config. sim-wasm embeds configs/default.toml and merges this
# file on top of it (table-wise; arrays such as [[food.biomes]] are replaced whole).
# The result is what tr_init uses when it is passed an empty TOML string, and it
# is the base that tr_init_overlay merges further overrides onto.
#
# Keeping this an overlay means the demo automatically tracks default.toml when
# the simulation is retuned, and only the watchability knobs below differ.
# Tuned for watching in a browser at ~60 ticks/s, NOT for experiments; use
# default.toml for sweeps so results stay comparable.
#
# To run the demo world headless for comparison, merge by hand or use
# sim-runner with default.toml and these values changed.

[food]
regrowth_rate = 0.002   # default 0.0005: the default world holds only a few dozen creatures; this one
                        # holds a few hundred, so there is something to watch (checked 2026-11-15)

[food.seasons]
period = 3600.0         # default 10000: one season cycle ~1 min at 60 ticks/s

[food.droughts]
spawn_rate = 0.0006     # default 0.0002: ~one new drought every ~1700 ticks
duration = 1500         # default 3000: shorter, more frequent disturbances

[daynight]
period = 600.0          # default 40: 40 ticks flickers at 60 fps; 600 ~= 10 s per day
